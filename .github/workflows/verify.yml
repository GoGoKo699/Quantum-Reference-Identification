name: Verify science and hosted mathematics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce finite scientific checks
        run: |
          python -m pip install -r verification/requirements.txt
          python verification/check_reference_identification.py > science-results.json
      - name: Install browser and source compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/qri-hosted-deps" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/qri-hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture actual pinned GitHub pages at two widths
        env:
          NODE_PATH: ${{ runner.temp }}/qri-hosted-deps/node_modules
        run: |
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --contract verification/hosted/math-contract.json \
            --output "$GITHUB_WORKSPACE/hosted-evidence"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qri-verification-${{ env.SOURCE_REVISION }}
          path: |
            science-results.json
            hosted-evidence/
          if-no-files-found: error
          retention-days: 14
